name: Between
options:
  bundleIdPrefix: app.between
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.3'
configs:
  Demo: debug
  Development: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
    PRODUCT_NAME: $(TARGET_NAME)
  configs:
    Demo:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: 'DEBUG DEMO'
      BETWEEN_MODE: demo
    Development:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      BETWEEN_MODE: development
    Release:
      BETWEEN_MODE: release
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.4
targets:
  Between:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Demo: Config/Demo.xcconfig
      Development: Config/Live.xcconfig
      Release: Config/Live.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.between.study
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Between.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
  BetweenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Between
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BetweenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Between
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Between-Demo:
    build:
      targets:
        Between: all
    run:
      config: Demo
    test:
      config: Demo
      targets: [BetweenTests, BetweenUITests]
    archive:
      config: Demo
  Between-Live:
    build:
      targets:
        Between: all
    run:
      config: Development
    test:
      config: Development
      targets: [BetweenTests]
    archive:
      config: Release
